<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>الروبوت + Gemini</title>
    <link rel="icon" href="data:," />
    <style>
      :root { --bg: #0d1017; --panel: rgba(21, 26, 36, .92); --line: #2a3347; --text: #e9eef7; --dim: #93a0b8; --blue: #0080c6; --orange: #f78a2c; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 15px/1.5 "Segoe UI", Tahoma, system-ui, sans-serif; }
      #stage { position: fixed; inset: 0; }
      #chat { position: fixed; inset-block: 16px; inset-inline-end: 16px; width: min(420px, calc(100vw - 32px)); display: flex; flex-direction: column;
        background: var(--panel); border: 1px solid var(--line); border-radius: 16px; backdrop-filter: blur(10px); overflow: hidden; }
      header { display: flex; gap: 8px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); }
      header h1 { margin: 0; font-size: 15px; flex: 1; }
      #status { padding: 2px 10px; border-radius: 99px; font-size: 12px; background: #1d2536; color: var(--dim); }
      #status[data-s="thinking"] { background: #3a2d12; color: #ffc247; }
      #status[data-s="speaking"] { background: #0f3550; color: #7fd3ff; }
      #status[data-s="listening"] { background: #123a26; color: #5bff9a; }
      #status[data-s="error"] { background: #45161c; color: #ff8a95; }
      select, input, button { font: inherit; color: var(--text); background: #10141d; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
      button { cursor: pointer; } button:hover { border-color: var(--blue); }
      button.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
      #log { flex: 1; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
      .msg { max-width: 92%; padding: 8px 12px; border-radius: 14px; white-space: pre-wrap; }
      .user { align-self: flex-start; background: #1b2438; }
      .bot { align-self: flex-end; background: #0e2c42; border: 1px solid #14425f; }
      .bot.err { background: #45161c; border-color: #6d2430; color: #ffc0c6; }
      .cmd { align-self: flex-end; max-width: 92%; padding: 6px 10px; border-radius: 12px; background: #17210f; border: 1px solid #2c4a1a; color: #c9f0a4; font-size: 13px; display: flex; flex-direction: column; gap: 2px; }
      .cmd .bad { color: #ffb36b; } .cmd .wait { color: var(--dim); }
      #chips { display: flex; gap: 6px; padding: 8px 14px 0; overflow-x: auto; scrollbar-width: thin; }
      #chips button { flex: none; padding: 4px 10px; font-size: 13px; border-radius: 99px; background: #131a28; }
      .hint { color: var(--dim); font-size: 13px; text-align: center; }
      form { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--line); }
      #q { flex: 1; min-width: 0; }
      #stop { display: none; }
      @media (max-width: 700px) { #chat { inset-block-start: auto; height: 46vh; } }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <aside id="chat">
      <header>
        <h1>اسأل الروبوت</h1>
        <span id="status" data-s="idle">جاهز</span>
        <select id="lang" title="اللغة"><option value="ar">العربية</option><option value="en">English</option><option value="auto">تلقائي</option></select>
      </header>
      <div id="log"><div class="hint">اكتب سؤالك أو اضغط 🎤 وتحدّث. الروبوت يفكّر ثم يجيب بصوته وحركته. ويمكنك أيضاً إعطاؤه أوامر مثل «تقدم للأمام» أو «اذهب إلى المكتب ثم لوّح» (اضغط ؟ للقائمة).</div></div>
      <div id="chips" title="أوامر سريعة"></div>
      <form id="form">
        <input id="q" autocomplete="off" placeholder="اسأل، أو أصدر أمراً: تقدم مترين…" />
        <button type="button" id="mic" title="تحدّث">🎤</button>
        <button type="button" id="stop" title="إيقاف">⏹</button>
        <button class="primary" id="send">إرسال</button>
      </form>
    </aside>
    <script type="module" src="./gemini/main.ts"></script>
  </body>
</html>
